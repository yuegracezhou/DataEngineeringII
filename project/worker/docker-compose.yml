version: '3.8'

services:
  worker: # This is the service name within Docker Compose
    build: .  # Tells Docker Compose to build an image from the Dockerfile in the current directory
#    container_name: worker_1 # Explicitly names the container created by this service
    environment:
      RABBITMQ_HOST: "192.168.2.97"    # <<< IMPORTANT: Use the actual IP of your RabbitMQ Broker VM
      RABBITMQ_QUEUE: "project_queue"  # Or your specific queue name
      # Add any other environment variables your worker script might need
    # Optional: You can mount volumes if you want to persist or inspect data
    # Make sure the host directories (e.g., ./cloned_projects_w1) exist first
    # volumes:
    #   - ./cloned_projects_w1:/work
    #   - ./test_results_w1:/results
    restart: unless-stopped
