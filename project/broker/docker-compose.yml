version: '3.8' 
services:
  rabbitmq:
    image: rabbitmq:management # Uses the official RabbitMQ image with the management plugin
    container_name: rabbitmq_broker_service 
    hostname: my-rabbit # Hostname inside the Docker network
    ports:
      - "5672:5672"  
      - "15672:15672" 
    restart: unless-stopped # Restarts the container unless it's manually stopped
